<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | EventEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">Event<span>Ease</span></a>
  <nav aria-label="Main navigation">
    <a href="index.html">Dashboard</a>
    <a href="events.html">Events</a>
    <a href="bookings.html">Bookings</a>
    <a href="create-event.html">Create Event</a>
    <a href="reports.html">Reports</a>
    <a href="register.html">Register</a>
    <a href="notifications.html">Notifications</a>
    <a href="login.html">Login</a>
  </nav>
</header>
<main class="container">
  <div class="page-intro"><p class="eyebrow">JOIN EVENTEASE</p><h1>Create an Account</h1><p>Register as an event organizer or participant.</p></div>

<form class="panel auth-box">
 <div class="form-group"><label for="full-name">Full Name</label><input id="full-name" type="text" placeholder="Enter your name" required></div>
 <div class="form-group"><label for="reg-email">Email Address</label><input id="reg-email" type="email" placeholder="Enter your email" required></div>
 <div class="form-group"><label for="reg-password">Create Password</label><input id="reg-password" type="password" placeholder="Create a password" required></div>
 <div class="form-group"><label for="reg-role">Choose Role</label><select id="reg-role" required><option value="">Select a role</option><option>Event Organizer</option><option>Participant</option></select></div>
 <button type="submit" class="button">Create Account</button><p class="form-note">Already registered? <a class="text-link" href="login.html">Login here</a></p>
</form>

</main>
<footer><p>© 2026 EventEase | Centralized Event Planning Platform</p><p><a href="index.html">Back to dashboard ↑</a></p></footer>
</body>
</html>
