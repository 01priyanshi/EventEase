<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login | EventEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">Event<span>Ease</span></a>
  <nav aria-label="Main navigation">
    <a href="index.html">Dashboard</a>
    <a href="events.html">Events</a>
    <a href="bookings.html">Bookings</a>
    <a href="create-event.html">Create Event</a>
    <a href="reports.html">Reports</a>
    <a href="notifications.html">Notifications</a>
    <a href="login.html">Login</a>
  </nav>
</header>
<main class="container">
  <div class="page-intro"><p class="eyebrow">WELCOME BACK</p><h1>User Login</h1><p>Sign in to your EventEase account.</p></div>

<form class="panel auth-box">
 <div class="form-group"><label for="email">Email Address</label><input id="email" type="email" placeholder="Enter your email" required></div>
 <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" required></div>
 <div class="form-group"><label for="role">Login As</label><select id="role" required><option value="">Select your role</option><option>Administrator</option><option>Event Organizer</option><option>Participant</option></select></div>
 <button type="submit" class="button">Login</button><p class="form-note">Don't have an account? <a class="text-link" href="register.html">Register here</a></p>
</form>

</main>
<footer><p>© 2026 EventEase | Centralized Event Planning Platform</p><p><a href="index.html">Back to dashboard ↑</a></p></footer>
</body>
</html>
